<rect x="317" y="0" width="6" height="16" fill="#fff" rx="0" opacity="0.5" /><rect x="317" y="32" width="6" height="16" fill="#fff" rx="0" opacity="0.5" /><rect x="317" y="64" width="6" height="16" fill="#fff" rx="0" opacity="0.5" /><rect x="317" y="96" width="6" height="16" fill="#fff" rx="0" opacity="0.5" /><rect x="317" y="128" width="6" height="16" fill="#fff" rx="0" opacity="0.5" /><rect x="317" y="160" width="6" height="16" fill="#fff" rx="0" opacity="0.5" /><rect x="317" y="192" width="6" height="16" fill="#fff" rx="0" opacity="0.5" /><rect x="317" y="224" width="6" height="16" fill="#fff" rx="0" opacity="0.5" /><rect x="317" y="256" width="6" height="16" fill="#fff" rx="0" opacity="0.5" /><rect x="317" y="288" width="6" height="16" fill="#fff" rx="0" opacity="0.5" /><rect x="40" y="110" width="12" height="80" fill="#fff" rx="3" opacity="1" filter="url(#glow)"/><rect x="588" y="160" width="12" height="80" fill="#fff" rx="3" opacity="1" filter="url(#glow)"/><rect x="354" y="152" width="14" height="14" fill="#fff" rx="2" opacity="0.4" /><rect x="328" y="164" width="14" height="14" fill="#fff" rx="2" opacity="0.32" /><rect x="302" y="176" width="14" height="14" fill="#fff" rx="2" opacity="0.24" /><rect x="276" y="188" width="14" height="14" fill="#fff" rx="2" opacity="0.16" /><rect x="250" y="200" width="14" height="14" fill="#fff" rx="2" opacity="0.08" /><rect x="380" y="140" width="14" height="14" fill="#fff" rx="2" opacity="1" filter="url(#glow)"/><text x="240" y="70" font-family="monospace" font-weight="bold" font-size="48" fill="#fff" opacity="0.8" >3</text><text x="380" y="70" font-family="monospace" font-weight="bold" font-size="48" fill="#fff" opacity="0.8" >5</text>
